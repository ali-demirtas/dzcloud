name: Build Plugins

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Plugins
        run: gradle make -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cloudstream-Plugins
          path: |
            **/*.cs3
            **/plugins.json
