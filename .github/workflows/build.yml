name: Build and Deploy Plugins

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Plugins
        run: |
          gradle makePlugins -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
          mkdir -p deploy
          cp -r build/*.cs3 deploy/ 2>/dev/null || cp -r DizipalProvider/build/*.cs3 deploy/ 2>/dev/null || true
          cp -r build/*.json deploy/ 2>/dev/null || cp -r DizipalProvider/build/*.json deploy/ 2>/dev/null || true

      - name: Deploy to Builds Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: builds
